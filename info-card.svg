<svg viewBox="0 0 760 502" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace" xml:space="preserve">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000" opacity="0"/>
      <rect width="4" height="1.4" y="0" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="phos" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a3d1e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#031007" stop-opacity="0"/>
    </radialGradient>
    <style>
      text{ fill:#3dff74; }
      .k{ fill:#8affab; font-weight:bold; }
      .v{ fill:#2fd657; }
      .dim{ fill:#188a3a; }
      @keyframes boot { 0%{opacity:0} 100%{opacity:1} }
      @keyframes flash { 0%{opacity:.9} 12%{opacity:0} 100%{opacity:0} }
      @keyframes linein { from{opacity:0} to{opacity:1} }
      @keyframes flicker { 0%,100%{opacity:1} 47%{opacity:1} 48%{opacity:.86} 49%{opacity:1} 72%{opacity:1} 73%{opacity:.9} 74%{opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes sweep { 0%{transform:translateY(-20px)} 100%{transform:translateY(520px)} }
      #stage{ animation: boot .55s ease both, flicker 4.2s linear .55s infinite; }
      #powerflash{ animation: flash 1.1s ease-out both; }
      #sweepbar{ animation: sweep 7s linear infinite; }
      .row{ opacity:0; animation: linein .35s ease-out forwards; }
      #cursor{ animation: blink 1.05s steps(1) .1s infinite; }
    </style>
  </defs>

